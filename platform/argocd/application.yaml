apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: devops-starter-kit
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Nishath06/argo-demo-app-fastapi-vite-infra.git
    targetRevision: main
    path: apps

  destination:
    server: https://kubernetes.default.svc
    namespace: starter-kit

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true