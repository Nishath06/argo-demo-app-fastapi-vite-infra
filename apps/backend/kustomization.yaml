apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

commonLabels:
  app.kubernetes.io/managed-by: argocd
  environment: dev
  project: devops-example

images:
  - name: BACKEND_IMAGE
    newName: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/backend
    newTag: latest